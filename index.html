<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>เป็นแฟนกันมั้ย</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Itim&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Itim", cursive;
      }

      body {
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #ffeef5;

        overflow-x: hidden;
        overflow-y: auto;

        padding: 20px;
      }

      .card {
        width: 400px;
        max-width: 100%;

        background: #fff4fa;
        border-radius: 30px;
        padding: 40px 30px;
        text-align: center;

        box-shadow: 0 10px 30px rgba(255, 105, 180, 0.15);

        transition: 0.3s;
        position: relative;
      }

      .hidden {
        display: none;
      }

      .gif {
        width: 130px;
        margin-bottom: 15px;
      }

      h1 {
        color: #e67aa4;
        font-size: 38px;
        margin-bottom: 10px;
        line-height: 1.3;
      }

      p {
        color: #666;
        margin-bottom: 25px;
        line-height: 1.5;
        font-size: 18px;
      }

      .progress-box {
        width: 100%;
        height: 28px;
        background: #ffd3e2;
        border-radius: 20px;
        overflow: hidden;
        margin-bottom: 15px;
      }

      .progress {
        width: 0%;
        height: 100%;
        background: #f57ca8;
        border-radius: 20px;
        transition: 0.2s;
      }

      small {
        color: #999;
        font-size: 14px;
      }

      .btn-group {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;

        margin-top: 20px;

        position: relative;

        flex-wrap: wrap;
      }

      button {
        border: none;
        padding: 12px 30px;
        border-radius: 15px;
        font-size: 22px;
        cursor: pointer;
        transition: 0.2s;
      }

      button:hover {
        transform: scale(1.05);
      }

      .yes-btn {
        background: #f57ca8;
        color: white;
        width: 100%;
      }

      .no-btn {
        background: #d98aa5;
        color: white;
        position: relative;
      }

      /* Mobile Responsive */
      @media (max-width: 480px) {
        body {
          padding: 15px;
        }

        .card {
          width: 100%;
          padding: 30px 20px;
          border-radius: 25px;
        }

        .gif {
          width: 105px;
        }

        h1 {
          font-size: 30px;
        }

        p {
          font-size: 16px;
        }

        .progress-box {
          height: 24px;
        }

        button {
          font-size: 18px;
          padding: 10px 22px;
        }

        small {
          font-size: 12px;
        }

        .btn-group {
          gap: 12px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Loading -->
    <div class="card" id="loadingCard">
      <img
        src="https://media.giphy.com/media/cQSjIBgUC2NbMKEm9q/giphy.gif"
        class="gif"
      />

      <h1>Loading...</h1>

      <p>รอสักครู่นะคะที่รัก 💖</p>

      <div class="progress-box">
        <div class="progress" id="progress"></div>
      </div>

      <small>ห้ามปิดหน้านี้เด็ดขาด</small>
    </div>

    <!-- Question -->
    <div class="card hidden" id="questionCard">
      <img
        src="https://media.giphy.com/media/cQSjIBgUC2NbMKEm9q/giphy.gif"
        class="gif"
      />

      <h1>เธอรักเค้าไหม?</h1>

      <p>เค้าสัญญาว่าจะดูแลเธอได้ดีที่สุดเท่าที่เค้าทำได้เลยนะ</p>

      <div class="btn-group">
        <button class="yes-btn" onclick="yesAnswer()">รัก</button>

        <!-- <button class="no-btn" id="noBtn">ไม่รัก</button> -->
      </div>
    </div>

    <script>
      const progress = document.getElementById("progress");
      const loadingCard = document.getElementById("loadingCard");
      const questionCard = document.getElementById("questionCard");

      let width = 0;

      const interval = setInterval(() => {
        width++;

        progress.style.width = width + "%";

        if (width >= 100) {
          clearInterval(interval);

          setTimeout(() => {
            loadingCard.classList.add("hidden");
            questionCard.classList.remove("hidden");
          }, 500);
        }
      }, 40);

      function yesAnswer() {
        document.body.innerHTML = `

      <div style="
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        flex-direction:column;
        background:#ffeef5;
        text-align:center;
        padding:20px;
      ">

        <img 
          src="https://media.giphy.com/media/cQSjIBgUC2NbMKEm9q/giphy.gif"
          width="180"
          style="max-width:100%;"
        >

        <h1 style="
          color:#f57ca8;
          font-size:50px;
          margin-top:20px;
          line-height:1.3;
        ">
          เย้ 💖
        </h1>

        <p style="
          color:#666;
          font-size:24px;
          margin-top:10px;
          line-height:1.5;
        ">
          เค้าก็รักเธอเหมือนกัน
        </p>

      </div>

      `;
      }

      const noBtn = document.getElementById("noBtn");

      noBtn.addEventListener("mouseover", () => {
        const isMobile = window.innerWidth <= 480;

        const maxX = isMobile ? 80 : 150;
        const maxY = isMobile ? 60 : 100;

        const x = Math.random() * maxX - maxX / 2;
        const y = Math.random() * maxY - maxY / 2;

        noBtn.style.transform = `translate(${x}px, ${y}px)`;
      });
    </script>
  </body>
</html>
